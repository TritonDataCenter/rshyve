# Standalone Cargo project outside the root workspace, as is
# tools/fhrun-init: this binary cross-compiles to
# x86_64-unknown-linux-musl and runs only inside a guest. In the
# workspace, every host build would need a Linux toolchain. The root
# manifest lists it in `exclude` so path discovery skips it.

[package]
name = "virtiofs-test"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "PID 1 that mounts a virtio-fs share and reports on it."

[[bin]]
name = "virtiofs-test"
path = "src/main.rs"

# Literal version pins, not `.workspace = true`: this package inherits
# nothing from the root workspace.
[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Makes this directory its own workspace root, so Cargo does not add it
# to the workspace above.
[workspace]
