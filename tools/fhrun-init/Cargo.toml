# Standalone Cargo project, outside the root workspace. This binary
# cross-compiles to x86_64-unknown-linux-musl and runs only as PID 1
# inside a fhrun-launched microVM. In the workspace, every host build
# would need a Linux toolchain. The root manifest names it in `exclude`
# so path discovery skips it too.

[package]
name = "fhrun-init"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "PID 1 inside a fhrun microVM: mounts, networks, then execs the payload."

[[bin]]
name = "fhrun-init"
path = "src/main.rs"

# Literal version pins, not `.workspace = true`: this package inherits
# nothing from the root workspace.
[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Marks this directory as its own workspace root so Cargo does not fold
# it into the workspace above.
[workspace]
